let AC,eo,eg,so,sg,mute=false;
function au(){if(AC){if(AC.state==='suspended')AC.resume();return;}try{AC=new(window.AudioContext||window.webkitAudioContext)();eo=AC.createOscillator();eg=AC.createGain();eo.type='sawtooth';eg.gain.value=0;eo.connect(eg);eg.connect(AC.destination);eo.start();so=AC.createOscillator();sg=AC.createGain();so.type='square';sg.gain.value=0;so.connect(sg);sg.connect(AC.destination);so.start();}catch(e){}}

const mk=(t,x,y,a)=>{const d=TY[t];return{t,x,y,a,vx:0,vy:0,hp:d.hp,r:d.r,m:d.m,max:d.max,acc:d.acc,turn:d.turn,col:d.col,L:d.L,W:d.W,ic:0,ph:rnd(0,6),stk:0,rv:0,rs:1,slip:0,fl:0};};

const stars=()=>Math.min(5,1+fl(heat));
function drive(c,dt,thr,str,hb,nb){
 const fx=Math.cos(c.a),fy=Math.sin(c.a);let sp=c.vx*fx+c.vy*fy;
 c.a+=str*c.turn*(hb?1.5:1)*cl(sp/60,-1,1)*dt;
 const f2x=Math.cos(c.a),f2y=Math.sin(c.a),mx=c.max*(nb?1.35:1);
 if(thr>0){const ac=c.acc*(nb?1.8:1)*Math.max(.1,1-sp/mx)*thr;c.vx+=f2x*ac*dt;c.vy+=f2y*ac*dt;}
 else if(thr<0){if(sp>20){const b=1-3.5*dt;c.vx*=b;c.vy*=b;}else{c.vx+=f2x*thr*c.acc*.4*dt;c.vy+=f2y*thr*c.acc*.4*dt;}}
 sp=c.vx*f2x+c.vy*f2y;const lx=c.vx-f2x*sp,ly=c.vy-f2y*sp,gr=Math.exp(-(hb?1.2:7)*dt);c.slip=Math.hypot(lx,ly);
 c.vx=f2x*sp+lx*gr;c.vy=f2y*sp+ly*gr;const dr=Math.exp(-(thr>0?.15:.6)*dt);c.vx*=dr;c.vy*=dr;move(c,dt);}
function move(c,dt){const nx=c.x+c.vx*dt;if(ok(nx,c.y))c.x=nx;else hitW(c,1);const ny=c.y+c.vy*dt;if(ok(c.x,ny))c.y=ny;else hitW(c,0);}
function hitW(c,ax){const s=Math.abs(ax?c.vx:c.vy);if(ax)c.vx*=-.3;else c.vy*=-.3;c.vx*=.9;c.vy*=.9;if(s>60){hurt(c,s/28);spark(c.x,c.y,4);}}

function collide(a,b){const dx=b.x-a.x,dy=b.y-a.y,m=a.r+b.r;if(Math.abs(dx)>m||Math.abs(dy)>m)return;const d=Math.hypot(dx,dy);if(d>=m||d<.01)return;
 const nx=dx/d,ny=dy/d,ov=m-d,t=a.m+b.m,ox=a.x,oy=a.y,qx=b.x,qy=b.y;
 a.x-=nx*ov*b.m/t;a.y-=ny*ov*b.m/t;b.x+=nx*ov*a.m/t;b.y+=ny*ov*a.m/t;if(!ok(a.x,a.y)){a.x=ox;a.y=oy;}if(!ok(b.x,b.y)){b.x=qx;b.y=qy;}

function roadPt(an,d){let x=P.x+Math.cos(an)*d,y=P.y+Math.sin(an)*d;const mx=md(x,BS),my=md(y,BS);if(mx<RW)x=x-mx+RW/2;else if(my<RW)y=y-my+RW/2;else return null;return{x,y};}

function update(dt){
 T+=dt;heat+=dt/24;const st=stars(),tk=TKf();
 const Lf=K.KeyA||K.ArrowLeft||tk.L,Rt=K.KeyD||K.ArrowRight||tk.R;

 const nb=!!((K.ShiftLeft||K.ShiftRight||tk.N)&&nit>0&&thr>0);P.nb=nb;
 nit=nb?nit-dt*.45:Math.min(1,nit+dt*.1);

 drive(P,dt,thr,(Rt?1:0)-(Lf?1:0),!!K.Space,nb);
 if(P.slip>60&&SKD.length<500){const fx=Math.cos(P.a),fy=Math.sin(P.a);for(const s of[-1,1])SKD.push({x:P.x-fx*7-fy*s*3.5,y:P.y-fy*7+fx*s*3.5,t:7});}

 for(let i=0;i<COPS.length;i++){collide(P,COPS[i]);for(let j=i+1;j<COPS.length;j++)collide(COPS[i],COPS[j]);}

 spT-=dt;if(mob<want&&spT<=0){spT=1.2;const q=roadPt(rnd(0,TAU),rnd(480,640));if(q){const r=Math.random(),t=st>=3&&r<.25?2:st>=2&&r<.6?1:0;COPS.push(mk(t,q.x,q.y,rnd(0,TAU)));}}
 for(let i=COPS.length-1;i>=0;i--){const c=COPS[i];if(Math.hypot(c.x-P.x,c.y-P.y)>(c.st?950:(mob>want?360:1100)))COPS.splice(i,1);}

 for(const b of BL){const ins=b.vert?Math.abs(P.x-b.x)<RW/2&&Math.abs(P.y-b.y)<5:Math.abs(P.y-b.y)<RW/2&&Math.abs(P.x-b.x)<5;if(ins&&P.fl<=0){P.fl=4;pop={s:'PNEUS FURADOS!',t:1.6,c:'#ff4d6d'};bp(200,.3,'sawtooth',.1,60);}}

 if(cash>0&&Math.hypot(SH.x-P.x,SH.y-P.y)<38){bank+=cash;pop={s:'GUARDADO! +R$ '+cash,t:2,c:'#7CFC9A'};cash=0;heat=Math.max(0,heat-1.2);P.hp=Math.min(100,P.hp+25);bp(500,.1);setTimeout(()=>bp(800,.15),100);newSH();}

const ASPH=pat(64,64,x=>{x.fillStyle='#1b1e2b';x.fillRect(0,0,64,64);dots(x,64,64,260,'#222637');dots(x,64,64,200,'#141722');dots(x,64,64,40,'#2c3145');dots(x,64,64,14,'#0e1019',3,1);dots(x,64,64,10,'rgba(90,120,180,.14)',7,1);x.fillStyle='#10121b';x.fillRect(10,40,9,1);x.fillRect(18,41,6,1);x.fillRect(40,12,1,8);x.fillRect(41,19,1,4);});

 for(let r=0;r<2;r++)for(let k=0;k<4;k++){const wx=k*16+4,wy=r*24+6,l=rn(),cc=l<.5?'#ffd98a':l<.62?'#ff9f5a':l<.7?'#8fd0ff':'#0e1524';
